<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tìm kiếm đối tác</title>
<style>
:root {
  --bg:#f4f7fb; --card:#ffffff; --text:#172033; --muted:#6b7280; --line:#e5eaf2;
  --primary:#2563eb; --primary2:#1d4ed8; --soft:#eff6ff; --success:#0f766e;
}
* { box-sizing:border-box; }
body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background:linear-gradient(135deg,#f8fbff,#eef3fa); color:var(--text); }
.app { max-width:1180px; margin:0 auto; padding:28px 20px 48px; }
.hero { background:linear-gradient(120deg,#153e75,#2563eb); color:#fff; border-radius:22px; padding:28px 30px; box-shadow:0 18px 42px rgba(37,99,235,.22); }
.hero h1 { margin:0 0 8px; font-size:clamp(25px,4vw,38px); letter-spacing:-.03em; }
.hero p { margin:0; color:#dbeafe; font-size:15px; }
.search-panel { margin-top:18px; background:var(--card); border:1px solid rgba(255,255,255,.5); border-radius:18px; padding:16px; box-shadow:0 12px 28px rgba(15,23,42,.09); }
.search-row { display:flex; gap:10px; align-items:center; }
.search-box { flex:1; position:relative; }
.search-box input { width:100%; border:2px solid #dbe4f0; border-radius:13px; padding:15px 48px 15px 16px; font-size:16px; outline:none; transition:.2s; }
.search-box input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(37,99,235,.12); }
.search-icon { position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#64748b; font-size:19px; }
button { border:0; border-radius:12px; padding:13px 17px; font-weight:700; cursor:pointer; transition:.2s; }
.clear-btn { background:#eef2f7; color:#334155; }
.clear-btn:hover { background:#e2e8f0; }
.toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-top:13px; align-items:center; }
select { border:1px solid #dbe4f0; background:#fff; border-radius:10px; padding:10px 12px; color:#334155; }
.kana-list { display:flex; flex-wrap:wrap; gap:7px; }
.kana-btn { padding:8px 11px; border:1px solid #dbe4f0; background:#fff; color:#475569; border-radius:9px; font-size:13px; }
.kana-btn.active, .kana-btn:hover { background:var(--primary); color:#fff; border-color:var(--primary); }
.stats { display:flex; gap:10px; flex-wrap:wrap; margin:18px 0 12px; }
.stat { background:#fff; border:1px solid var(--line); border-radius:14px; padding:13px 16px; min-width:145px; }
.stat strong { display:block; font-size:22px; color:var(--primary2); }
.stat span { color:var(--muted); font-size:12px; }
.result-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin:18px 0 10px; }
.result-head h2 { margin:0; font-size:18px; }
.hint { color:var(--muted); font-size:13px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(275px,1fr)); gap:12px; }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 5px 14px rgba(15,23,42,.04); transition:.2s; }
.card:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(15,23,42,.10); border-color:#bfd3f7; }
.card-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.name { font-size:16px; font-weight:800; line-height:1.4; }
.code { font-variant-numeric:tabular-nums; color:var(--primary2); background:var(--soft); border-radius:8px; padding:5px 8px; font-weight:800; font-size:13px; white-space:nowrap; }
.meta { display:flex; gap:7px; flex-wrap:wrap; margin-top:13px; }
.tag { font-size:11px; color:#64748b; background:#f8fafc; border:1px solid #e9eef5; border-radius:999px; padding:5px 8px; }
.copy { margin-top:13px; padding:8px 10px; background:#f1f5f9; color:#334155; font-size:12px; }
.copy:hover { background:#dbeafe; color:#1d4ed8; }
mark { background:#fef08a; color:inherit; padding:0 2px; border-radius:3px; }
.empty { padding:40px 20px; text-align:center; color:var(--muted); background:#fff; border:1px dashed #cbd5e1; border-radius:16px; }
.footer { margin-top:25px; color:#94a3b8; font-size:12px; text-align:center; }
@media(max-width:620px) { .app { padding:15px 12px 30px; } .hero { padding:22px 18px; } .search-row { flex-direction:column; align-items:stretch; } .clear-btn { width:100%; } .stat { flex:1; min-width:110px; } }
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>🔎 Tìm kiếm đối tác nhanh</h1>
    <p>Tra cứu theo tên công ty, mã đối tác, nhóm chữ cái hoặc từ khóa gần đúng.</p>
    <div class="search-panel">
      <div class="search-row">
        <div class="search-box"><input id="searchInput" type="search" placeholder="Nhập tên công ty hoặc mã, ví dụ: 1408, MKI, 東洋..." autofocus /><span class="search-icon">⌕</span></div>
        <button class="clear-btn" id="clearBtn">Xóa bộ lọc</button>
      </div>
      <div class="toolbar">
        <select id="groupFilter"><option value="">Tất cả nhóm</option></select>
        <div class="kana-list" id="kanaList"></div>
      </div>
    </div>
  </section>
  <section class="stats">
    <div class="stat"><strong id="totalCount">0</strong><span>Tổng đối tác</span></div>
    <div class="stat"><strong id="shownCount">0</strong><span>Kết quả phù hợp</span></div>
    <div class="stat"><strong id="groupCount">0</strong><span>Nhóm đang hiển thị</span></div>
  </section>
  <div class="result-head"><h2>Danh sách kết quả</h2><div class="hint">Nhấn “Sao chép” để copy tên + mã</div></div>
  <div id="results" class="grid"></div>
  <div class="footer">Dữ liệu được lấy từ workbook danh sách đối tác</div>
</div>

const input = document.getElementById('searchInput');
const groupFilter = document.getElementById('groupFilter');
const kanaList = document.getElementById('kanaList');
const results = document.getElementById('results');
const totalCount = document.getElementById('totalCount');
const shownCount = document.getElementById('shownCount');
const groupCount = document.getElementById('groupCount');
let activeKana = '';

const normalize = value => String(value || '').toLowerCase().normalize('NFKC').replace(/\s+/g,'');
const escapeHtml = value => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[ch]);
function highlight(value, query) {
  const safe = escapeHtml(value);
  if (!query) return safe;
  const q = escapeHtml(query);
  return safe.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'), m => '<mark>'+m+'</mark>');
}
function setup() {
  totalCount.textContent = DATA.length;
  [...new Set(DATA.map(x=>x.group))].sort().forEach(group => {
    const opt = document.createElement('option'); opt.value = group; opt.textContent = group; groupFilter.appendChild(opt);
  });
  const kanas = [...new Set(DATA.map(x=>x.kana).filter(Boolean))].sort();
  kanaList.innerHTML = '<button class="kana-btn active" data-kana="">Tất cả</button>' + kanas.map(k => `<button class="kana-btn" data-kana="${escapeHtml(k)}">${escapeHtml(k)}</button>`).join('');

    activeKana = btn.dataset.kana;
    kanaList.querySelectorAll('.kana-btn').forEach(x => x.classList.toggle('active', x === btn));
    render();
  }));
  render();
}
function render() {
  const query = input.value.trim(); const nq = normalize(query); const selectedGroup = groupFilter.value;
  const filtered = DATA.filter(item => {
    const hay = normalize(item.display + ' ' + item.name + ' ' + item.code + ' ' + item.group);
    return (!nq || hay.includes(nq)) && (!selectedGroup || item.group === selectedGroup) && (!activeKana || item.kana === activeKana);
  });
  shownCount.textContent = filtered.length;
  groupCount.textContent = new Set(filtered.map(x=>x.group)).size;
  if (!filtered.length) { results.innerHTML = '<div class="empty">Không tìm thấy kết quả phù hợp.<br><small>Hãy thử từ khóa ngắn hơn hoặc xóa bớt bộ lọc.</small></div>'; return; }
  results.innerHTML = filtered.map(item => `<article class="card"><div class="card-top"><div class="name">${highlight(item.name, query)}</div><div class="code">${item.code || '—'}</div></div><div class="meta"><span class="tag">${escapeHtml(item.group)}</span><span class="tag">Dòng ${item.row}</span></div><button class="copy" data-copy="${escapeHtml(item.display + (item.code ? ' - ' + item.code : ''))}">📋 Sao chép</button></article>`).join('');
  results.querySelectorAll('[data-copy]').forEach(btn => btn.addEventListener('click', async () => {
    await navigator.clipboard.writeText(btn.dataset.copy); const old = btn.textContent; btn.textContent = '✅ Đã sao chép'; setTimeout(() => btn.textContent = old, 1200);
  }));
}
input.addEventListener('input', render); groupFilter.addEventListener('change', render);
document.getElementById('clearBtn').addEventListener('click', () => { input.value=''; groupFilter.value=''; activeKana=''; kanaList.querySelectorAll('.kana-btn').forEach(x => x.classList.toggle('active', !x.dataset.kana)); render(); input.focus(); });
setup();
